<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081a15">
  <meta name="description" content="滑动点亮圣诞树，拆开挂在枝头的祝福卡。">
  <title>圣诞来信｜树上有一封信</title>
  <link rel="stylesheet" href="style.css">
  <script src="tree.js" defer></script>
  <script src="card.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#tree-card">跳到圣诞贺卡</a>
  <main>
    <section class="tree-track" id="greeting" aria-labelledby="tree-title">
      <div class="scene">
        <canvas id="tree-scene" aria-hidden="true"></canvas>
        <header class="site-header">
          <a class="wordmark" href="#greeting"><span aria-hidden="true">✦</span> 圣诞来信</a>
          <nav aria-label="主导航"><a href="#compose">写一张贺卡 <span aria-hidden="true">↗</span></a></nav>
        </header>

        <div class="scene-copy">
          <p class="holiday" lang="en">Merry Christmas</p>
          <h1 id="tree-title">树上有<br>一封信<span>。</span></h1>
          <p class="scene-description">往下滑，看看树上的灯光怎么变。<br>点一下枝头的红信封，就能读贺卡。</p>
        </div>

        <button class="tree-card" id="tree-card" type="button" data-open-card aria-haspopup="dialog">
          <span class="card-string" aria-hidden="true"></span>
          <span class="envelope" aria-hidden="true"><i>✦</i></span>
          <span class="tree-card-label">打开贺卡</span>
        </button>

        <div class="scene-controls">
          <button class="scroll-cue" id="scroll-cue" type="button">
            <span class="scroll-arrow" aria-hidden="true">↓</span><span>滑动切换特效</span>
          </button>
          <div class="scene-progress" aria-hidden="true">
            <span id="scene-phase">金色灯火</span>
            <span class="progress-track"><span id="progress-fill"></span></span>
          </div>
        </div>

        <noscript><p class="noscript-note">请开启 JavaScript 观看圣诞树并打开贺卡。</p></noscript>
      </div>
    </section>

    <section class="compose" id="compose" aria-labelledby="compose-title">
      <div class="compose-copy">
        <span class="section-star" aria-hidden="true">✦</span>
        <h2 id="compose-title">把祝福挂上树</h2>
        <p>写下对方的名字和一句祝福。朋友收到的链接里，会有你亲手写的贺卡。</p>
        <img class="compose-image" src="assets/christmas-eve.jpg" width="1536" height="1024"
          alt="雪夜里亮着暖灯的松林小屋" loading="lazy">
      </div>
      <form id="card-form">
        <div class="form-row">
          <label>收信人 <input name="to" maxlength="24" placeholder="朋友的名字" autocomplete="off"></label>
          <label>落款 <input name="from" maxlength="24" placeholder="你的名字" autocomplete="off"></label>
        </div>
        <label>祝福语
          <textarea name="wish" maxlength="160" rows="4" placeholder="愿你这个冬天，遇到很多温柔的小事。"></textarea>
        </label>
        <button class="button button-green" type="submit">生成祝福卡 <span aria-hidden="true">↗</span></button>
        <div class="share-result" id="share-result" hidden>
          <div class="share-fields" id="share-fields" hidden>
            <label>你的分享链接 <input id="share-link" readonly spellcheck="false"></label>
            <button class="button button-outline" id="copy-link" type="button">复制链接</button>
          </div>
          <p class="status" id="share-status" role="status"></p>
          <button class="text-button" type="button" data-open-card aria-haspopup="dialog">预览贺卡 <span aria-hidden="true">↗</span></button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>圣诞来信 <span aria-hidden="true">✦</span></span>
    <a href="#greeting">回到圣诞树 <span aria-hidden="true">↑</span></a>
  </footer>

  <dialog class="letter" id="christmas-letter" aria-labelledby="card-recipient">
    <article class="letter-paper">
      <form method="dialog" class="close-form">
        <button class="close-card" type="submit" aria-label="关闭贺卡" autofocus>×</button>
      </form>
      <p class="letter-holiday" lang="en"><span aria-hidden="true">✦</span> Merry Christmas</p>
      <h2 id="card-recipient">给正在读这封信的你</h2>
      <p id="card-message">愿你今晚睡得安稳，明早醒来有好心情。愿新的一年，有人陪你走很远的路，也有许多小事让你忍不住笑。圣诞快乐！</p>
      <p id="card-sender">—— 圣诞来信</p>
    </article>
  </dialog>
</body>
</html>
